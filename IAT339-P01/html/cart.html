<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cart</title>

    <link href="../css/main.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <nav class="main-nav">
        <div class="nav-left">
          <a class="nav-link" href="#home">HOME</a>
          <a class="nav-link" href="../html/index.html">STYLE GUIDE</a>
        </div>

        <div class="nav-right">
          <a class="nav-link" href="#about">ABOUT</a>
          <a class="nav-link" href="../html/product-listing.html">MENU</a>
          <a class="nav-link" href="#contact">CONTACT US</a>
          <a class="current" href="../html/cart.html">CART</a>
        </div>
      </nav>
    </header>

    <section class="checkout-layout">
      <div class="cart">
        <h1>CART DETAILS</h1>
        <h4>Order Summary</h4>

        <div class="cart-item">
          <img
            src="../image/brown-sugar-milk-tea-icon.png"
            alt="Brown sugar pearl milk tea"
            class="image-icon"
          />

          <div class="cart-item-info">
            <div class="cart-title-price">
              <h3>Brown Sugar QQTea</h3>
              <h4>$5.60</h4>
            </div>

            <p>No Ice</p>
            <p>100% Sugar</p>

            <div class="cart-edit">
              <div class="quantity-control">
                <button type="button">-</button>
                <input
                  type="number"
                  id="quantity-brown-sugar"
                  value="1"
                  min="1"
                />
                <button type="button">+</button>
              </div>

              <div class="cart-action">
                <button class="edit-btn">Edit</button>
                <button class="remove-btn">Remove</button>
              </div>
            </div>
          </div>
        </div>

        <div class="cart-item">
          <img
            src="../image/osmanthus-lychee-lemonade-icon.png"
            alt="Osmanthus Lychee Lemonade"
            class="image-icon"
          />

          <div class="cart-item-info">
            <div class="cart-title-price">
              <h3>Osmanthus Lychee Lemonade</h3>
              <h4>$5.80</h4>
            </div>

            <p>Less Ice</p>
            <p>50% Sugar</p>

            <div class="cart-edit">
              <div class="quantity-control">
                <button type="button">-</button>
                <input type="number" id="quantity-lychee" value="1" min="1" />
                <button type="button">+</button>
              </div>

              <div class="cart-action">
                <button class="edit-btn">Edit</button>
                <button class="remove-btn">Remove</button>
              </div>
            </div>
          </div>
        </div>

        <div class="cart-total">
          <h4>Total</h4>
          <h4>$11.40</h4>
        </div>
        <a class="primary-button" href="checkout.html"> Proceed to Checkout </a>
      </div>
    </section>
  </body>
</html>
